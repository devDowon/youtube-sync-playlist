<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#0f0d12" />
<title>같이 듣기</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23181420'/%3E%3Cg fill='%23ff5d7d'%3E%3Crect x='9' y='13' width='3' height='7' rx='1.5' opacity='.6'/%3E%3Crect x='14.5' y='9' width='3' height='14' rx='1.5'/%3E%3Crect x='20' y='11.5' width='3' height='10' rx='1.5' opacity='.8'/%3E%3C/g%3E%3C/svg%3E" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="join-overlay" role="dialog" aria-modal="true" aria-labelledby="join-title">
    <div id="join-card">
      <span class="mark mark-lg" aria-hidden="true"><i></i><i></i><i></i></span>
      <h2 id="join-title" class="join-title">같이 듣기</h2>
      <p>브라우저 자동재생 제한 때문에 한 번 눌러야 재생이 시작돼요.</p>
      <div id="join-spinner" role="status" aria-label="준비 중"></div>
      <button id="join-btn" class="btn btn-primary btn-block" hidden>참여하기</button>
    </div>
  </div>

  <main>
    <header class="app-header">
      <div class="brand">
        <span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <h1>같이 듣기</h1>
      </div>
      <div id="viewer-count">접속자 수 확인 중…</div>
    </header>

    <div id="layout">
      <div id="main-col">
        <section class="stage">
          <div id="player-wrap">
            <div id="player"></div>
            <div id="player-shield" aria-hidden="true"></div>
          </div>

          <div class="stage-bar">
            <div id="now-playing-info">
              <span class="np-label">현재 곡</span>
              <span id="now-playing-title" aria-live="polite">재생 중인 곡 없음</span>
            </div>

            <div id="controls">
              <button id="skip-btn" class="btn btn-icon" disabled>다음 곡 투표</button>
              <button id="unmute-btn" class="btn btn-soft btn-icon" type="button">소리 켜기</button>
            </div>
          </div>
        </section>

        <section class="panel">
          <form id="add-form">
            <input id="link-input" class="field" type="text" placeholder="유튜브 링크를 붙여넣으세요" autocomplete="off" aria-label="유튜브 링크" />
            <button type="submit" class="btn btn-primary btn-icon btn-add">추가</button>
          </form>
          <p class="form-hint">1분에 한 곡씩 추가할 수 있어요. 20분이 넘는 영상은 자동으로 넘어가요.</p>

          <div class="panel-head">
            <h2>대기열</h2>
            <span class="panel-hint">추가한 순서대로 재생돼요</span>
          </div>
          <ol id="queue-list"></ol>
          <p class="empty">대기 중인 곡이 없어요.<br />첫 곡을 올려 분위기를 만들어 주세요.</p>
        </section>
      </div>

      <aside id="chat-col">
        <div class="panel-head">
          <h2>채팅</h2>
          <span class="panel-hint">최근 10개</span>
        </div>

        <div class="chat-body">
          <ul id="chat-list" role="log" aria-live="polite"></ul>
          <p class="empty chat-empty">아직 아무도 말이 없어요.<br />먼저 인사를 건네 보세요.</p>
        </div>

        <form id="chat-form">
          <input id="chat-input" class="field" type="text" placeholder="메시지 (익명)" maxlength="300" autocomplete="off" aria-label="채팅 메시지" />
          <button type="submit" class="btn btn-primary btn-icon btn-send" aria-label="메시지 보내기"></button>
        </form>
      </aside>
    </div>
  </main>

  <script src="app.js" type="module"></script>
  <script src="chat.js" type="module"></script>
  <script src="presence.js" type="module"></script>
</body>
</html>
